name: Build Desktop App
on:
  push:
    branches: [ "main" ]
jobs:
  build:
<source id="22"/>    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - run: npm install
    - run: npx electron-builder --win --x64
    - uses: actions/upload-artifact@v4
      with:
        name: my-game-exe
        path: dist/*.exe
